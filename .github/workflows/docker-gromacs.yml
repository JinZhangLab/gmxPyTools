# Build and push GROMACS Docker image to GitHub Container Registry (GHCR)
#
# Triggers:
#   - Push to main/master with changes in docker/gromacs/
#   - Git tags matching 'v*'
#   - Manual workflow dispatch (allows selecting GROMACS version)
#
# Images are tagged as:
#   ghcr.io/<owner>/gmxpytools/gromacs:<gmx_version>-cuda<cuda_version>
#   ghcr.io/<owner>/gmxpytools/gromacs:latest  (only for latest GROMACS version)

name: Build & Push GROMACS Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docker/gromacs/**'
      - '.github/workflows/docker-gromacs.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gromacs_version:
        description: 'GROMACS version to build (e.g. 2025.2)'
        required: false
        default: '2025.2'
      cuda_version:
        description: 'CUDA version (e.g. 12.8.1)'
        required: false
        default: '12.8.1'
      push_latest:
        description: 'Also tag as :latest'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gmxpytools/gromacs
  DEFAULT_GROMACS_VERSION: '2025.2'
  DEFAULT_CUDA_VERSION: '12.8.1'

jobs:
  build-and-push:
    name: Build GROMACS ${{ inputs.gromacs_version || '2025.2' }} / CUDA ${{ inputs.cuda_version || '12.8.1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          GMX_VERSION="${{ inputs.gromacs_version || env.DEFAULT_GROMACS_VERSION }}"
          CUDA_VER="${{ inputs.cuda_version || env.DEFAULT_CUDA_VERSION }}"
          echo "gmx_version=${GMX_VERSION}" >> "$GITHUB_OUTPUT"
          echo "cuda_version=${CUDA_VER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.params.outputs.gmx_version }}-cuda${{ steps.params.outputs.cuda_version }}
            type=raw,value=latest,enable=${{ inputs.push_latest == true }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker/gromacs
          file: docker/gromacs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROMACS_VERSION=${{ steps.params.outputs.gmx_version }}
            CUDA_VERSION=${{ steps.params.outputs.cuda_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
