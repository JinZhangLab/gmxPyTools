# Deploy documentation to GitHub Pages using MkDocs Material
#
# Triggers:
#   - Push to main/master when docs/ or mkdocs.yml changes
#   - Manual workflow dispatch
#
# Deploys to the gh-pages branch, served at:
#   https://jinzhanglab.github.io/gmxPyTools/

name: Deploy Docs

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build & deploy MkDocs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-revision-date-localized plugin (if added later)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
