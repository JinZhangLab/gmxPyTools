site_name: gmxPyTools
site_description: Tools, scripts, and Docker images for GROMACS molecular dynamics simulations
site_url: https://jinzhanglab.github.io/gmxPyTools/
repo_url: https://github.com/JinZhangLab/gmxPyTools
repo_name: JinZhangLab/gmxPyTools
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Docker Images:
    - GROMACS (CUDA): docker/gromacs.md
    - gmx_MMPBSA: docker/gmx-mmpbsa.md
  - Python Scripts:
    - CHARMM → GROMACS topology: scripts/convert-charmm-to-gromacs.md
  - Architecture: ARCHITECTURE.md
